name: "Ecosystem Upgrade Calldata: Regenerate + Verify (v31)"

# Regenerates the v31 ecosystem-upgrade calldata for ONE environment and
# verifies it with PUVT, on a Linux runner so the compiled bytecode — and
# therefore the CREATE2 addresses baked into `ecosystem.toml` — is bit-identical
# with CI (the whole reason this can't be trusted from a dev's macOS checkout).
#
# It builds the CONTRACTS AND protocol_ops FROM THE CHECKED-OUT BRANCH (not a
# pre-built Docker image), so the regenerated calldata reflects the current
# source.
#
# ─── REUSABLE / ENV-GENERIC ───
# The `environment` input is just the basename of a config pair:
#     upgrade-envs/permanent-values/<env>.toml
#     upgrade-envs/v0.31.0-interopB/<env>.toml
# Everything else is derived from those files + the live chain, so adding a NEW
# ecosystem needs no workflow edits — commit that config pair (and, only if the
# env needs its own anvil port, a `case` in regen-and-verify.sh) and type its
# name here. The L1 to fork is selected automatically from the env's
# `l1_chain_id` (1 → mainnet, 11155111 → Sepolia). Built-in envs: stage,
# testnet, mainnet, battlechain.
#
# ─── VERIFY MODE ───
# `verify_mode`:
#   * strict      — PUVT (`ecosystem verify-upgrade`) must pass for the job to be
#                   green. Use for PUH-governed envs (stage/testnet/mainnet).
#   * report-only — still RUN PUVT and print its full output, but do NOT fail the
#                   job on its exit code. For ecosystems whose topology the
#                   mainnet-oriented PUVT doesn't fully model — legacy-Governance
#                   owned and/or single-chain (no canonical Era chain), e.g.
#                   battlechain. The calldata artifacts are produced by the
#                   prepare step regardless of PUVT; review the printed PUVT
#                   output for the (expected) exemptions.
#
# ─── SECRET HYGIENE (the L1 RPC URL carries an API key) ───
# The RPC URL comes from EITHER a repo secret (default, fully hidden) OR the
# optional dispatch-time `l1_rpc_url` input. Whichever is used, the workflow
# masks it with `::add-mask::` (redacted everywhere in the LOGS, including
# subprocess output like anvil's `--fork-url`) and passes it only via
# $GITHUB_ENV (job-scoped) — never $GITHUB_OUTPUT, never into an artifact.
#
# ⚠️ CAVEAT on the `l1_rpc_url` INPUT: GitHub has no masked workflow_dispatch
# input. A value typed into the "Run workflow" box is shown in the run-summary
# inputs panel and via `gh run view` — `::add-mask::` only redacts LOG text. If
# the URL must never be exposed, leave the input blank and use the repo secret.
#
# ─── GENERATION IS KEYLESS ───
# Generation is a fork rehearsal: the deployer EOA is IMPERSONATED (anvil
# --auto-impersonate) and nothing is signed, so only the deployer ADDRESS is
# needed — never a private key. A deployer private key is required ONLY for the
# optional `deploy` step (real broadcast).
#
# Repository secrets:
#   L1_RPC_URL_MAINNET            — used by mainnet + any l1_chain_id==1 env (battlechain)
#   L1_RPC_URL_SEPOLIA            — used by stage + testnet (both fork Sepolia)
#                                   (either may be omitted if you always pass the
#                                    `l1_rpc_url` input instead)
# Optional:
#   DEPLOYER_PRIVATE_KEY_MAINNET  — only for `deploy` (real broadcast) on L1 mainnet
#   DEPLOYER_PRIVATE_KEY_SEPOLIA  — only for `deploy` on Sepolia
#   GW_RPC_URL                    — Gateway RPC for PUVT GW-side checks
#                                   (only exercised on gateway-enabled envs)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Env = basename of the config pair upgrade-envs/permanent-values/<env>.toml + upgrade-envs/v0.31.0-interopB/<env>.toml. Built-ins: stage, testnet, mainnet, battlechain. The L1 to fork is chosen from the env's l1_chain_id (1 → mainnet, 11155111 → Sepolia)."
        required: true
        default: "battlechain"
        type: string
      verify_mode:
        description: "strict = PUVT must pass (PUH-governed envs: stage/testnet/mainnet). report-only = run PUVT but don't fail the job on its exit (legacy-gov / single-chain envs like battlechain; artifacts still produced)."
        required: false
        default: "report-only"
        type: choice
        options:
          - report-only
          - strict
      l1_rpc_url:
        description: "L1 RPC URL (optional override; BLANK = repo secret chosen by l1_chain_id. NOTE: a typed value is visible in the run summary — not secret-grade)."
        required: false
        default: ""
        type: string
      deployer_address:
        description: "Deployer EOA address (public). Fork rehearsal impersonates it — nothing is signed — so only the address is needed. BLANK = derive from DEPLOYER_PRIVATE_KEY_* if set, else use a neutral placeholder (the address does not affect CREATE2 output)."
        required: false
        default: ""
        type: string
      fork_block:
        description: "L1 block to fork at (BLANK = chain tip). Pin to a block BEFORE the upgrade was deployed if the ecosystem is already live (re-running prepare against post-deploy tip reverts). CREATE2 addresses are deterministic, so output is identical."
        required: false
        default: ""
        type: string
      zksync_foundry_version:
        description: "foundry-zksync version (forge --zksync)."
        required: false
        default: "v0.1.5"
        type: string
      zk_governance_commit:
        description: "zk-governance commit for PUVT bytecode metadata (PUH-governed envs only). Mainnet v31 = 9b06a16. Ignored by legacy-gov envs (no PUH)."
        required: false
        default: "9b06a16"
        type: string
      use_new_salt:
        description: "Rotate every deployment salt in the v31 input TOML to fresh random values before prepare (new CREATE2 addresses). Useful when the current salt's addresses are already occupied on-chain."
        required: false
        default: false
        type: boolean
      push_artifacts:
        description: "Commit the regenerated artifacts (ecosystem.toml + sim-inputs/ + transaction-simulator.json) and push them to the branch this run was dispatched on, refreshing its PR. Uses the workflow GITHUB_TOKEN (contents: write)."
        required: false
        default: false
        type: boolean
      deploy:
        description: "Also broadcast the deployer-EOA bundle to the REAL L1 (needs DEPLOYER_PRIVATE_KEY_<net>). Governance/multisig bundles are never sent. Leave OFF for calldata generation."
        required: false
        default: false
        type: boolean

# contents: write so `push_artifacts` can commit the regenerated calldata back
# to the dispatched branch with the workflow token (no extra secret needed).
permissions:
  contents: write
  pull-requests: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install foundry-zksync (for forge --zksync)
        uses: ./.github/actions/install-zksync-foundry
        with:
          version: ${{ inputs.zksync_foundry_version }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install dependencies
        run: yarn

      # `yarn l1 build:foundry` builds both EVM (out/) and EraVM (zkout/)
      # artifacts; da + sc artifacts are referenced by the prepare/PUVT.
      - name: Build da-contracts artifacts
        run: yarn da build:foundry
      - name: Build system-contracts artifacts
        run: yarn sc build:foundry
      - name: Build l1-contracts artifacts (EVM + zkout)
        run: yarn l1 build:foundry

      - name: Build protocol_ops
        working-directory: protocol-ops
        run: cargo build --release

      - name: Install anvil-interop dependencies
        working-directory: l1-contracts/test/anvil-interop
        run: yarn install

      # Pick the L1 network from the env's `l1_chain_id`, select + mask the
      # matching RPC secret, and resolve the deployer address (public; the fork
      # rehearsal impersonates it). Everything sensitive goes to $GITHUB_ENV.
      - name: Select L1 (by l1_chain_id) + mask RPC + resolve deployer
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY: ${{ inputs.deploy }}
          # Referenced as shell vars (not `${{ }}`-interpolated into the body)
          # to avoid shell-injection / metacharacter issues.
          INPUT_RPC: ${{ inputs.l1_rpc_url }}
          INPUT_DEPLOYER: ${{ inputs.deployer_address }}
          RPC_SEPOLIA: ${{ secrets.L1_RPC_URL_SEPOLIA }}
          RPC_MAINNET: ${{ secrets.L1_RPC_URL_MAINNET }}
          PK_SEPOLIA: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          PK_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          GW_RPC_URL: ${{ secrets.GW_RPC_URL }}
        run: |
          set -euo pipefail
          PV="l1-contracts/upgrade-envs/permanent-values/${ENVIRONMENT}.toml"
          if [ ! -f "$PV" ]; then
            echo "::error::No permanent-values config for env '$ENVIRONMENT' at $PV. Commit the config pair first." >&2
            exit 1
          fi
          if [ ! -f "l1-contracts/upgrade-envs/v0.31.0-interopB/${ENVIRONMENT}.toml" ]; then
            echo "::error::No v0.31.0-interopB input config for env '$ENVIRONMENT'." >&2
            exit 1
          fi
          # l1_chain_id → network. Capture the digits AFTER '=' (not any digit
          # in the key name, e.g. the '1' in 'l1_chain_id').
          L1_CHAIN_ID="$(sed -nE 's/^[[:space:]]*l1_chain_id[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$PV" | head -1)"
          if [ -z "$L1_CHAIN_ID" ]; then
            echo "::error::$PV is missing a top-level 'l1_chain_id ='." >&2
            exit 1
          fi
          echo "env=$ENVIRONMENT l1_chain_id=$L1_CHAIN_ID"
          case "$L1_CHAIN_ID" in
            1)         rpc="$RPC_MAINNET"; pk="${PK_MAINNET:-}"; net="mainnet" ;;
            11155111)  rpc="$RPC_SEPOLIA"; pk="${PK_SEPOLIA:-}"; net="sepolia" ;;
            *) echo "::error::Unsupported l1_chain_id=$L1_CHAIN_ID (only 1 / 11155111 wired to secrets)." >&2; exit 1 ;;
          esac
          echo "L1 network: $net"
          # Optional dispatch-time RPC override wins over the secret.
          if [ -n "${INPUT_RPC:-}" ]; then
            rpc="$INPUT_RPC"
            echo "Using L1 RPC from the dispatch input (masked in logs; visible in run summary)."
          fi
          if [ -z "$rpc" ]; then
            echo "::error::No L1 RPC for $net: pass l1_rpc_url or set the matching L1_RPC_URL_* secret." >&2
            exit 1
          fi
          echo "::add-mask::$rpc"
          echo "L1_FORK_URL=$rpc" >> "$GITHUB_ENV"

          # Resolve the deployer ADDRESS (public). Priority: explicit input →
          # derive from the deploy key (if set) → neutral placeholder. The
          # address does NOT affect CREATE2 output (salts + Arachnid factory do),
          # so a placeholder is fine for a fork rehearsal.
          if [ -n "${INPUT_DEPLOYER:-}" ]; then
            deployer="$INPUT_DEPLOYER"
          elif [ -n "${pk:-}" ]; then
            echo "::add-mask::$pk"
            deployer="$(cast wallet address --private-key "$pk")"
          else
            deployer="0x000000000000000000000000000000000000dEaD"
            echo "No deployer_address input and no deploy key — using placeholder $deployer (impersonated; does not affect output)."
          fi
          echo "Deployer (impersonated on the fork): $deployer"
          echo "DEPLOYER_ADDR=$deployer" >> "$GITHUB_ENV"

          # The deploy step needs the real key. Fail early if requested without one.
          if [ "$DEPLOY" = "true" ]; then
            if [ -z "${pk:-}" ]; then
              echo "::error::deploy=true but no DEPLOYER_PRIVATE_KEY_* secret for $net." >&2
              exit 1
            fi
            echo "::add-mask::$pk"
            echo "DEPLOYER_PK=$pk" >> "$GITHUB_ENV"
          fi

          if [ -n "${GW_RPC_URL:-}" ]; then
            echo "::add-mask::$GW_RPC_URL"
            echo "GW_RPC_URL=$GW_RPC_URL" >> "$GITHUB_ENV"
          fi

      # Optional: rotate every deployment salt in the v31 input TOML to fresh
      # random values so this run deploys to brand-new CREATE2 addresses. Runs
      # BEFORE prepare so the new salts flow into the generated calldata.
      - name: Use new random deployment salt
        if: ${{ inputs.use_new_salt }}
        run: |
          set -euo pipefail
          TOML="l1-contracts/upgrade-envs/v0.31.0-interopB/${{ inputs.environment }}.toml"
          newsalt() { echo "0x$(openssl rand -hex 32)"; }
          sed -i -E "s|^(create2_factory_salt[[:space:]]*=[[:space:]]*)\"0x[0-9a-fA-F]+\"|\1\"$(newsalt)\"|" "$TOML"
          # legacy_gov_salt is only present on legacy-Governance envs.
          if grep -qE '^legacy_gov_salt[[:space:]]*=' "$TOML"; then
            sed -i -E "s|^(legacy_gov_salt[[:space:]]*=[[:space:]]*)\"0x[0-9a-fA-F]+\"|\1\"$(newsalt)\"|" "$TOML"
          fi
          # Per-CTM salts under [create2_factory_salts] — each stays DISTINCT.
          # Rotate only the VALUE after `=`, never the CTM-address key.
          awk '
            /^\[create2_factory_salts\]/ { intbl=1; print; next }
            /^\[/ && !/^\[create2_factory_salts\]/ { intbl=0 }
            intbl && /=[[:space:]]*"0x[0-9a-fA-F]+"/ {
              cmd="openssl rand -hex 32"; cmd | getline r; close(cmd);
              sub(/=[[:space:]]*"0x[0-9a-fA-F]+"/, "= \"0x" r "\"");
            }
            { print }
          ' "$TOML" > "$TOML.tmp" && mv "$TOML.tmp" "$TOML"
          echo "Rotated deployment salts in $TOML:"
          grep -nE '^(create2_factory_salt|legacy_gov_salt)[[:space:]]*=' "$TOML" || true
          sed -n '/^\[create2_factory_salts\]/,/^\[/p' "$TOML" | grep -E '= "0x' || true

      - name: Regenerate + verify calldata
        working-directory: l1-contracts/test/anvil-interop
        env:
          # report-only → PUVT non-fatal (artifacts still produced). See header.
          VERIFY_NONFATAL: ${{ inputs.verify_mode == 'report-only' && '1' || '0' }}
          ZK_GOVERNANCE_COMMIT: ${{ inputs.zk_governance_commit }}
          FORK_BLOCK: ${{ inputs.fork_block }}
        run: |
          # L1_FORK_URL (masked) + DEPLOYER_ADDR come from $GITHUB_ENV. The
          # script forks L1_FORK_URL into a local anvil and runs prepare/PUVT
          # against localhost; DEPLOYER_ADDR puts it in impersonation mode (no
          # signing key needed).
          ./regen-and-verify.sh "${{ inputs.environment }}"

      - name: Emit sim-inputs + transaction-simulator.json
        run: |
          set -euo pipefail
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}"
          BIN=./protocol-ops/target/release/protocol_ops
          MANIFEST="$OUT/prepare/manifest.json"
          # $DEPLOYER_ADDR (from $GITHUB_ENV) is the Camp-A signer; its bundles
          # are dropped from the sim-inputs (they're broadcast to the real chain).
          "$BIN" ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --include-manifest "$MANIFEST" \
            --camp-a-signers "$DEPLOYER_ADDR" \
            --emit-sim-inputs "$OUT/sim-inputs"
          # The ready-to-paste full simulator input (--include-manifest defaults
          # to sim-inputs/manifest.json written above).
          "$BIN" ecosystem governance-toml-to-simulator \
            --env "${{ inputs.environment }}" \
            --out "$OUT/transaction-simulator.json"

      # Optional: broadcast the deployer-EOA bundle to the REAL L1. Ungated by
      # PUVT (`!cancelled()`), since prepare's bundles already exist. Only the
      # deployer-EOA bundle is sent (governance/multisig bundles never). Uses the
      # idempotent `dev execute-safe` (skips already-deployed CREATE2).
      - name: Deploy deployer bundle to real L1
        if: ${{ !cancelled() && inputs.deploy }}
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/$ENV"
          MANIFEST="$OUT/prepare/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No prepare manifest at $MANIFEST — prepare did not run." >&2
            exit 1
          fi
          DEPLOYER="$(cast wallet address --private-key "$DEPLOYER_PK")"
          DEPLOYER_LC="$(echo "$DEPLOYER" | tr '[:upper:]' '[:lower:]')"
          mapfile -t FILES < <(jq -r --arg d "$DEPLOYER_LC" \
            '.bundles | sort_by(.index)[] | select((.target|ascii_downcase) == $d) | .file' "$MANIFEST")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No deployer bundle for $DEPLOYER in $MANIFEST" >&2
            exit 1
          fi
          OUT_DIR="$OUT/real-broadcast"; mkdir -p "$OUT_DIR"
          for f in "${FILES[@]}"; do
            echo "=== execute-safe: $f -> real $ENV ==="
            ./protocol-ops/target/release/protocol_ops dev execute-safe \
              --safe-file "$OUT/prepare/$f" \
              --l1-rpc-url "$L1_FORK_URL" \
              --private-key "$DEPLOYER_PK" \
              --out "$OUT_DIR/executed.json"
          done
          echo "Broadcast complete. Receipts in $OUT_DIR/executed.json"

      # Optional: commit the regenerated artifacts and push them to the branch
      # this run was dispatched on (refreshing its PR), so the calldata is
      # reviewable in the diff (not just a downloadable artifact).
      - name: Commit + push regenerated artifacts
        if: ${{ !cancelled() && inputs.push_artifacts }}
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          OUT="l1-contracts/upgrade-envs/v0.31.0-interopB/output/$ENV"
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Also stage the input TOML so a use_new_salt run records the salts.
          INPUT_TOML="l1-contracts/upgrade-envs/v0.31.0-interopB/$ENV.toml"
          # Stage WITHOUT -f so .gitignore is honoured (anvil.log / *.safe.json /
          # manifest.json / fork-rehearsal/ stay out; ecosystem.toml,
          # transaction-simulator.json, sim-inputs/*, verification logs are kept).
          git add "$OUT" "$INPUT_TOML"
          if git diff --cached --quiet; then
            echo "No artifact changes on $BRANCH — calldata already up to date."
            exit 0
          fi
          git commit \
            -m "ci(regen): refresh $ENV v31 upgrade calldata" \
            -m "Regenerated by generate-ecosystem-upgrade-calldata (run ${{ github.run_id }}) against a fresh anvil fork. verify_mode=${{ inputs.verify_mode }}."
          git push origin "HEAD:${BRANCH}"
          echo "Pushed refreshed artifacts to ${BRANCH}."

      # Upload the calldata deliverables. Deliberately NOT anvil.log — it can
      # echo the forked RPC URL.
      - name: Upload calldata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-upgrade-calldata-${{ inputs.environment }}
          path: |
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/ecosystem.toml
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/sim-inputs/
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/transaction-simulator.json
            l1-contracts/upgrade-envs/v0.31.0-interopB/output/${{ inputs.environment }}/extra-verification-logs.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup anvil
        if: always()
        working-directory: l1-contracts/test/anvil-interop
        run: bash cleanup.sh
